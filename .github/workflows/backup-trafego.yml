name: Backup de Tráfego do GitHub

on:
  schedule:
    # Roda todo domingo às 23:59
    - cron: '59 23 * * 0'
  workflow_dispatch: # Permite disparar o gatilho manualmente na aba Actions

jobs:
  salvar-historico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Coletar dados da API usando GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          mkdir -p historico_trafego
          # Salva visualizações e clones em arquivos JSON separados por data
          gh api repos/${{ github.repository }}/traffic/views > historico_trafego/views_$(date +'%Y-%m-%d').json
          gh api repos/${{ github.repository }}/traffic/clones > historico_trafego/clones_$(date +'%Y-%m-%d').json

      - name: Commitar e fazer push dos dados
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add historico_trafego/
          git commit -m "chore: backup semanal de tráfego [skip ci]" || echo "Nenhuma mudança para commitar"
          git push
